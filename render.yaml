services:
  - type: web
    name: smp-marko
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_CONTENT_TOKEN
        sync: false
      - key: GITHUB_CONTENT_REPO
        value: useral4/smp-marko
      - key: GITHUB_CONTENT_BRANCH
        value: main
