server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.smp-marko.ru;

    ssl_certificate /etc/letsencrypt/live/smp-marko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smp-marko.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://smp-marko.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smp-marko.ru;

    ssl_certificate /etc/letsencrypt/live/smp-marko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smp-marko.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name smp-marko.ru www.smp-marko.ru;
    return 301 https://smp-marko.ru$request_uri;
}
